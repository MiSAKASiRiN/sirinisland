name: Build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SIRIN_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
